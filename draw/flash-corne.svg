<text x='24.0' y='520.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='400' fill='#24292f' text-anchor='start'>3. Copy the .uf2 to the RPI-RP2 drive. Both halves use the same file.</text>

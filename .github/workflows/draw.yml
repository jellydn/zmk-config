name: Draw keymap
on:
  workflow_dispatch:
  push:
    paths:
      - config/*.keymap
      - config/*.dtsi
      - config/boards/**
      - draw/config.yaml

permissions:
  contents: write

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    with:
      keymap_patterns: config/silakka54.keymap
      config_path: draw/config.yaml
      output_folder: draw
      commit_message: "chore(draw): render keymap"
      fail_on_error: true

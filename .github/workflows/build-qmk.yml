name: Build Corne v4.1 Vial firmware
on:
  workflow_dispatch:
  workflow_call: # used by release.yml
  push:
    paths:
      - qmk/keymaps/**
      - qmk/corne-v4.1-graphite.vil
      - .github/workflows/build-qmk.yml
  pull_request:
    paths:
      - qmk/keymaps/**
      - qmk/corne-v4.1-graphite.vil
      - .github/workflows/build-qmk.yml

permissions:
  contents: read

# Same sources as foostan's Corne v4.1 Vial build (foostan/kbd_firmware `make
# vial-qmk-compile`): his keyboard definition on top of the vial-qmk revision
# his repo pins.
env:
  KBD_FIRMWARE_REF: 7e94242f7474761609d7ec16df0872a9785c2ccb
  VIAL_QMK_REF: dd43959ae5c08d8a28d38a1acf7b04e86b14a344

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal build takes about 2 minutes; fail fast if apt or pip hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: foostan/kbd_firmware
          ref: ${{ env.KBD_FIRMWARE_REF }}
          path: kbd_firmware

      - uses: actions/checkout@v7
        with:
          repository: vial-kb/vial-qmk
          ref: ${{ env.VIAL_QMK_REF }}
          path: vial-qmk
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          pip install qmk -r vial-qmk/requirements.txt

      - name: Add keyboard and keymap
        run: |
          kb=vial-qmk/keyboards/tmp/crkbd
          mkdir -p "$kb"
          cp -r kbd_firmware/keyboards/crkbd/qmk/qmk_firmware/* "$kb"
          rm -rf "$kb/keymaps"
          mkdir -p "$kb/keymaps"
          cp -r qmk/keymaps/jellydn "$kb/keymaps/"

      - name: Build
        working-directory: vial-qmk
        env:
          QMK_HOME: ${{ github.workspace }}/vial-qmk
        run: qmk compile -kb tmp/crkbd/rev4_1/standard -km jellydn

      # qmk compile also copies the .uf2 to the vial-qmk root; upload-artifact
      # skips the hidden .build/ folder.
      - name: Collect firmware
        run: |
          mkdir firmware
          cp vial-qmk/*.uf2 qmk/corne-v4.1-graphite.vil firmware/

      - uses: actions/upload-artifact@v7
        with:
          name: corne-v4.1-vial
          path: firmware/
          if-no-files-found: error
